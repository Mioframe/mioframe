name: verify

# Development verification for develop-bound work: focused pnpm verify,
# a separate PR version merge gate, PR preview deploys (pr/<number>/), and the
# develop branch deploy (branch/develop/) on push to develop. PR previews depend
# on implementation verification, not on the independent version merge gate. PRs/pushes
# to main use the separate `release` workflow (.github/workflows/release.yml)
# instead — see docs/release.md. The trigger below excludes PRs into main so
# this workflow and the release gate never both run for the same PR path.

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
    branches-ignore:
      - main
  push:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      BEAVER_CI_AUTOFIX_TOKEN: ${{ secrets.BEAVER_CI_AUTOFIX_TOKEN }}

    steps:
      # Check out the real PR branch, not the synthetic merge ref, so safe fixer output
      # can be committed back to the branch under review when the autofix token is configured.
      - name: Checkout with autofix token
        if: env.BEAVER_CI_AUTOFIX_TOKEN != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          token: ${{ secrets.BEAVER_CI_AUTOFIX_TOKEN }}

      - name: Checkout read-only
        if: env.BEAVER_CI_AUTOFIX_TOKEN == ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Fetch pull request base branch
        run: git fetch --no-tags origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
        env:
          BASE_REF: ${{ github.base_ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Independent of implementation verification: a missing/invalid version-impact
      # label leaves package.json untouched and exits successfully here, deferring the
      # blocking decision to the release-version job (see docs/release.md).
      - name: Materialize PR version from release-intent label
        run: node scripts/release/materializePrVersion.mjs

      - name: Run autofix fixers
        id: autofix_verify
        run: |
          set +e
          pnpm ci:autofix
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - name: Handle autofix changes
        run: |
          git add -A

          if git diff --cached --quiet --exit-code; then
            status="${{ steps.autofix_verify.outputs.exit_code }}"

            if [ "$status" -ne 0 ]; then
              echo "pnpm ci:autofix failed without producing mechanical changes."
            fi

            exit "$status"
          fi

          if [ -z "${BEAVER_CI_AUTOFIX_TOKEN}" ]; then
            echo "pnpm ci:autofix produced mechanical changes, but CI cannot commit them without BEAVER_CI_AUTOFIX_TOKEN."
            echo "Add the repository secret to enable CI autofix commits, or rerun without expecting autofix pushes."
            exit 1
          fi

          # Use the standard GitHub Actions bot noreply identity for automation commits.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # package.json may carry a materialized version bump alongside (or instead
          # of) mechanical autofix output; the commit message must not describe a
          # version materialization commit as formatting-only autofix.
          if git diff --cached --name-only | grep -qx package.json; then
            commit_message="chore: materialize release version and apply CI autofix"
          else
            commit_message="chore: apply CI autofix"
          fi

          git commit -m "$commit_message"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          echo "Autofix commit pushed; waiting for a new workflow run on the updated head."
          exit 1

      - name: Upload autofix logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: autofix-logs
          path: .verify/logs/
          if-no-files-found: ignore
          retention-days: 7

  verification-static:
    needs:
      - autofix
    if: >-
      !cancelled() &&
      (needs.autofix.result == 'success' || needs.autofix.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || github.ref }}

      - name: Fetch pull request base branch
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
        env:
          BASE_REF: ${{ github.base_ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Verify format
        run: pnpm verify --verbose --only format

      - name: Verify oxlint
        run: pnpm verify --verbose --only oxlint

      - name: Verify eslint
        run: pnpm verify --verbose --only eslint

      - name: Verify type-check
        run: pnpm verify --verbose --only type-check

      - name: Verify unit tests
        run: pnpm verify --verbose --only unit-tests

      - name: Verify mutation
        run: pnpm verify --verbose --only mutation

      - name: Upload static verify logs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-static-logs
          path: .verify/logs/
          if-no-files-found: ignore
          retention-days: 7

  # Single run-scoped producer for the Storybook static build: behavior and
  # visual are independent parallel proof lanes, but the static compilation
  # they both preview is only a shared prerequisite, not proof itself. This
  # job builds it at most once per workflow run and hands it to both lanes as
  # a run-scoped GitHub Actions artifact (never a cross-run cache). E2E does
  # not depend on this job — it needs no Storybook artifact.
  storybook-build:
    needs:
      - autofix
    if: >-
      !cancelled() &&
      (needs.autofix.result == 'success' || needs.autofix.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.build.outputs.ready }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || github.ref }}

      - name: Fetch pull request base branch
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
        env:
          BASE_REF: ${{ github.base_ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Verify storybook build
        id: build
        run: |
          set -euo pipefail
          pnpm verify --verbose --only storybook-build

          index_present=false
          iframe_present=false
          [ -f storybook-static/index.html ] && index_present=true
          [ -f storybook-static/iframe.html ] && iframe_present=true

          if [ "$index_present" = true ] && [ "$iframe_present" = true ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$index_present" = false ] && [ "$iframe_present" = false ]; then
            echo "Storybook static build was not required for this change; no artifact to publish."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "Storybook static build produced partial output (only one of index.html/iframe.html)." >&2
            exit 1
          fi

      - name: Upload Storybook static artifact
        if: steps.build.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 1

      - name: Upload storybook-build verify logs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-storybook-build-logs
          path: .verify/logs/
          if-no-files-found: ignore
          retention-days: 7

  # E2E is an independent proof owner with no Storybook dependency: it must
  # not wait on the storybook-build producer above.
  verification-browser-e2e:
    needs:
      - autofix
    if: >-
      !cancelled() &&
      (needs.autofix.result == 'success' || needs.autofix.result == 'skipped')
    name: verification-browser (e2e)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || github.ref }}

      - name: Fetch pull request base branch
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
        env:
          BASE_REF: ${{ github.base_ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Verify e2e
        run: pnpm verify --verbose --only e2e

      - name: Upload browser verify logs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-e2e-logs
          path: .verify/logs/
          if-no-files-found: ignore
          retention-days: 7

  # Storybook-owned browser proof: parallel behavior/visual lanes that reuse
  # the shared storybook-build producer's artifact instead of each compiling
  # Storybook themselves.
  verification-storybook-browser:
    needs:
      - autofix
      - storybook-build
    if: >-
      !cancelled() &&
      (needs.autofix.result == 'success' || needs.autofix.result == 'skipped') &&
      needs.storybook-build.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        lane:
          - storybook-behavior
          - visual
    name: verification-browser (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || github.ref }}

      - name: Fetch pull request base branch
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
        env:
          BASE_REF: ${{ github.base_ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Only ever populated when the producer actually built Storybook; when
      # it legitimately skipped (no storybook-relevant change), this lane
      # builds its own Storybook static output, same as a standalone run.
      - name: Download Storybook static artifact
        if: needs.storybook-build.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static

      - name: Verify ${{ matrix.lane }}
        env:
          STORYBOOK_STATIC_SKIP_BUILD: ${{ needs.storybook-build.outputs.ready == 'true' && '1' || '' }}
        run: pnpm verify --verbose --only ${{ matrix.lane }}

      - name: Upload browser verify logs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-${{ matrix.lane }}-logs
          path: .verify/logs/
          if-no-files-found: ignore
          retention-days: 7

  verification:
    needs:
      - verification-static
      - storybook-build
      - verification-browser-e2e
      - verification-storybook-browser
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1

    steps:
      - name: Require implementation verification lanes
        env:
          STATIC_RESULT: ${{ needs.verification-static.result }}
          STORYBOOK_BUILD_RESULT: ${{ needs.storybook-build.result }}
          E2E_RESULT: ${{ needs.verification-browser-e2e.result }}
          STORYBOOK_BROWSER_RESULT: ${{ needs.verification-storybook-browser.result }}
        run: |
          failed=0

          if [ "$STATIC_RESULT" != "success" ]; then
            echo "Static/unit verification result: $STATIC_RESULT"
            failed=1
          fi

          if [ "$STORYBOOK_BUILD_RESULT" != "success" ]; then
            echo "Storybook build producer result: $STORYBOOK_BUILD_RESULT"
            failed=1
          fi

          if [ "$E2E_RESULT" != "success" ]; then
            echo "E2E verification result: $E2E_RESULT"
            failed=1
          fi

          if [ "$STORYBOOK_BROWSER_RESULT" != "success" ]; then
            echo "Storybook browser verification result: $STORYBOOK_BROWSER_RESULT"
            failed=1
          fi

          exit "$failed"

  release-version:
    needs:
      - autofix
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      (needs.autofix.result == 'success' || needs.autofix.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || github.ref }}

      - name: Fetch pull request base branch
        run: git fetch --no-tags origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
        env:
          BASE_REF: ${{ github.base_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      # This is an independent merge gate. Its failure must not prevent the
      # implementation-verified application and Storybook preview from publishing.
      - name: Validate version bump
        run: node scripts/release/validateVersion.mjs

  verify:
    needs:
      - verification
      - release-version
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1

    steps:
      - name: Require merge gates
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERIFICATION_RESULT: ${{ needs.verification.result }}
          VERSION_RESULT: ${{ needs.release-version.result }}
        run: |
          failed=0

          if [ "$VERIFICATION_RESULT" != "success" ]; then
            echo "Implementation verification result: $VERIFICATION_RESULT"
            failed=1
          fi

          if [ "$EVENT_NAME" = "pull_request" ] && [ "$VERSION_RESULT" != "success" ]; then
            echo "PR version gate result: $VERSION_RESULT"
            failed=1
          fi

          exit "$failed"

  deploy-preview:
    needs: [verification]
    if: >-
      !cancelled() &&
      needs.verification.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !(startsWith(github.event.pull_request.head.ref, 'sync/main-') &&
        endsWith(github.event.pull_request.head.ref, '-back-to-develop'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: pages-publish
      cancel-in-progress: false

    steps:
      # PR head (app-source/) is untrusted: it may contain arbitrary code from
      # the PR author. It is only ever built here, never executed with the
      # Pages deploy token — see the trusted tooling/ checkout below.
      - name: Checkout PR head (app source)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: app-source

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app-source/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: app-source/package.json
          cache: pnpm
          cache-dependency-path: app-source/pnpm-lock.yaml

      - name: Install app-source dependencies
        working-directory: app-source
        run: pnpm install --frozen-lockfile

      - name: Build PR preview
        working-directory: app-source
        env:
          BASE_URL: /pr/${{ github.event.number }}/
          VITE_DISABLE_PWA: '1'
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: pnpm run build

      # Storybook is isolated from PWA/Sentry production behavior: no
      # application secrets are passed to this build.
      - name: Build PR preview Storybook
        working-directory: app-source
        env:
          BASE_URL: /pr/${{ github.event.number }}/storybook/
        run: pnpm storybook:build

      # Local artifact assembly only — no PR-head script execution, no Pages
      # write credential exists yet at this point in the job.
      - name: Assemble PR preview artifact (app + Storybook)
        working-directory: app-source
        run: |
          set -euo pipefail
          if [ ! -f dist/index.html ]; then
            echo "Application build did not produce dist/index.html" >&2
            exit 1
          fi
          if [ ! -f storybook-static/index.html ] || [ ! -f storybook-static/iframe.html ]; then
            echo "Storybook build did not produce storybook-static/index.html and iframe.html" >&2
            exit 1
          fi
          if [ -e dist/storybook ]; then
            echo "dist/storybook already exists; refusing to overwrite" >&2
            exit 1
          fi
          cp -R storybook-static dist/storybook

      # Trusted tooling (tooling/) is checked out from the PR's base branch,
      # never from the PR head. Every step below that can write to
      # Mioframe/mioframe.github.io — metadata, token generation, publish,
      # the preview comment — runs scripts from this checkout only.
      - name: Checkout trusted tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: tooling

      - name: Write deployment metadata
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: >-
          node tooling/scripts/pages/writeDeploymentMetadata.mjs
          --dist app-source/dist
          --channel pr
          --channel-id ${{ github.event.number }}
          --base-url /pr/${{ github.event.number }}/
          --ref "$PR_HEAD_REF"
          --branch "$PR_HEAD_REF"
          --sha ${{ github.event.pull_request.head.sha }}
          --app-version "$(node -p "require('./app-source/package.json').version")"

      - name: Generate Pages deploy token
        id: pages-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MIOFRAME_PAGES_APP_CLIENT_ID }}
          private-key: ${{ secrets.MIOFRAME_PAGES_APP_PRIVATE_KEY }}
          owner: Mioframe
          repositories: mioframe.github.io
          permission-contents: write

      - name: Publish PR preview to Mioframe/mioframe.github.io
        env:
          GITHUB_TOKEN: ${{ steps.pages-app-token.outputs.token }}
          PAGES_REPOSITORY: Mioframe/mioframe.github.io
        run: node tooling/scripts/pages/publishPreview.mjs --dist app-source/dist --pr ${{ github.event.number }}

      - name: Post or update preview comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: >-
          node tooling/scripts/pages/upsertPreviewComment.mjs
          --pr ${{ github.event.number }}
          --url "https://mioframe.github.io/pr/${{ github.event.number }}/"
          --storybook-url "https://mioframe.github.io/pr/${{ github.event.number }}/storybook/"

  deploy-develop:
    needs: [verification]
    if: >-
      !cancelled() &&
      needs.verification.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: pages-publish
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      # The canonical UTC committer timestamp of the checked-out commit,
      # derived once per job and passed to every managed build-metadata
      # consumer (Vite __BUILD_DATE__, release descriptor generation, and
      # deployment.json) — never the workflow's own execution time. See
      # docs/managed-pinned-updates.md, "Deterministic build inputs".
      - name: Resolve canonical build date
        id: build-date
        run: |
          echo "date=$(TZ=UTC git show -s --date=format-local:'%Y-%m-%dT%H:%M:%SZ' --format=%cd ${{ github.sha }})" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Validate managed release config (Sentry DSN required)
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: node scripts/release/validateReleaseConfig.mjs --managed

      - name: Build develop branch deployment
        env:
          BASE_URL: /branch/develop/
          VITE_RELEASE_CHANNEL: branch
          VITE_RELEASE_CHANNEL_ID: develop
          VITE_BUILD_DATE: ${{ steps.build-date.outputs.date }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: pnpm run build

      - name: Write deployment metadata
        run: >-
          node scripts/pages/writeDeploymentMetadata.mjs
          --dist dist
          --channel branch
          --channel-id develop
          --base-url /branch/develop/
          --ref ${{ github.ref }}
          --branch develop
          --slug develop
          --sha ${{ github.sha }}
          --app-version "$(node -p "require('./package.json').version")"
          --build-date ${{ steps.build-date.outputs.date }}

      - name: Generate Pages deploy token
        id: pages-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MIOFRAME_PAGES_APP_CLIENT_ID }}
          private-key: ${{ secrets.MIOFRAME_PAGES_APP_PRIVATE_KEY }}
          owner: Mioframe
          repositories: mioframe.github.io
          permission-contents: write

      - name: Publish develop build to Mioframe/mioframe.github.io
        env:
          GITHUB_TOKEN: ${{ steps.pages-app-token.outputs.token }}
          PAGES_REPOSITORY: Mioframe/mioframe.github.io
        run: >-
          node scripts/pages/publishBranch.mjs --dist dist --slug develop
          --app-version "$(node -p "require('./package.json').version")"
          --build-id ${{ github.sha }}
          --build-date ${{ steps.build-date.outputs.date }}
